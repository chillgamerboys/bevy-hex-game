[profile.ci]
# One failure must not hide unrelated regressions in another crate.
fail-fast = false
# Emit a live heartbeat for genuinely slow tests. The weekly stress workflow owns
# multi-minute corpora, so this is diagnostic rather than an excuse to terminate an
# otherwise-correct ordinary regression.
slow-timeout = "60s"

[profile.ci.junit]
# Relative profile paths are written below target/nextest/<profile>/.
path = "junit.xml"
store-success-output = false
store-failure-output = true

[profile.gameplay-rules]
fail-fast = false
slow-timeout = "60s"
default-filter = "package(hex_core) | package(hex_lattice) | package(hex_ai)"

[profile.gameplay-rules.junit]
path = "junit.xml"
store-success-output = false
store-failure-output = true

[profile.gameplay-contracts]
fail-fast = false
slow-timeout = "60s"
default-filter = "package(hex_test_support) | package(hex_units) | (package(hex_combat) & not binary(simulation))"

[profile.gameplay-contracts.junit]
path = "junit.xml"
store-success-output = false
store-failure-output = true

[profile.gameplay-simulation]
fail-fast = false
slow-timeout = "60s"
default-filter = "package(hex_combat_core)"

[profile.gameplay-simulation.junit]
path = "junit.xml"
store-success-output = false
store-failure-output = true

[profile.gameplay-app]
fail-fast = false
slow-timeout = "60s"
default-filter = "package(hex_gameplay_model) | (package(hex_game) & binary(gameplay_app))"

[profile.gameplay-app.junit]
path = "junit.xml"
store-success-output = false
store-failure-output = true

[profile.map-unit]
fail-fast = false
slow-timeout = "60s"
default-filter = "package(hex_map) & binary(hex_map) & not test(/^procedural/)"

[profile.map-unit.junit]
path = "junit.xml"
store-success-output = false
store-failure-output = true

[profile.map-generation]
fail-fast = false
slow-timeout = "60s"
default-filter = "package(hex_map) & binary(hex_map) & test(/^procedural/)"

[profile.map-generation.junit]
path = "junit.xml"
store-success-output = false
store-failure-output = true

[profile.map-contracts]
fail-fast = false
slow-timeout = "60s"
default-filter = "package(hex_map) & binary(contracts)"

[profile.map-contracts.junit]
path = "junit.xml"
store-success-output = false
store-failure-output = true
