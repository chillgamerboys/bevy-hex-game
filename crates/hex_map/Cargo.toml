[package]
name = "hex_map"
version.workspace = true
edition.workspace = true
publish = false
autotests = false
description = "Voxel storage, terrain generation, tile spawning, and map settings."

[features]
default = []
# Disposable world-detail profiles, planners, runtime reports, and render adapters.
# The shipping/default crate graph does not compile these modules or their JSON/hash
# dependencies.
map-review = ["dep:serde_json", "dep:sha2"]

# A leaf crate. Nothing depends on it except the binary, so gameplay, camera, sky,
# and screens cannot import its implementation. The ECS component contract still
# matters at runtime: bad tile metadata can break movement or presentation.
#
# It talks to the rest of the game through `hex_core`'s vocabulary: it spawns
# entities carrying `HexTile`, `HexCoord`, surface `TilePos`, `HexSpan`,
# `SubstanceId`, and `Headroom`; `hex_units` reads those components off the
# entities rather than reaching for anything defined here.
[dependencies]
bevy = { workspace = true }
hex_assets = { workspace = true }
hex_core = { workspace = true }
hex_multiplayer = { workspace = true }
hex_schematic = { workspace = true }
rand = { workspace = true }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = { version = "1", optional = true }
sha2 = { workspace = true, optional = true }
xxhash-rust = { workspace = true }

[dev-dependencies]
hex_assets = { workspace = true }
hex_test_support = { workspace = true }
ron = { workspace = true }

[lints]
workspace = true

[[test]]
name = "contracts"
path = "tests/contracts.rs"

[[test]]
name = "schematic_compile"
path = "tests/schematic_compile.rs"
