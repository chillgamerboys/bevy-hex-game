[package]
name = "hex_game"
version.workspace = true
edition.workspace = true
publish = false
autotests = false
description = "Thin launcher library and composition root for gameplay, world, and runtime UI."

[dependencies]
bevy = { workspace = true }
atomicwrites = { workspace = true }
hex_assets = { workspace = true }
hex_objects = { workspace = true }
hex_combat = { workspace = true }
hex_core = { workspace = true }
hex_gameplay_model = { workspace = true }
hex_ui = { workspace = true }
hex_lattice = { workspace = true }
hex_units = { workspace = true }
hex_map = { workspace = true }
hex_perception = { workspace = true }
hex_world = { workspace = true }
hex_dev = { workspace = true, optional = true }
ron = { workspace = true }
serde = { workspace = true }
serde_json = "1"
xxhash-rust = { workspace = true }

[dev-dependencies]
# Only for the tests that open each scenario's world file and check it parses.
ron = { workspace = true }
hex_ai = { workspace = true }
hex_anim = { workspace = true }
hex_test_support = { workspace = true }

[features]
# Empty by default so `cargo build --release` ships without the inspector. Use
# `cargo dev` (aliased in .cargo/config.toml) for a build with dev tooling.
default = []
# Development tooling: world inspector, debug overlays, and live asset reload so
# editing a file under assets/config/ takes effect without restarting.
dev = ["dep:hex_dev", "bevy/file_watcher", "hex_ui/dev-tools"]
# Deterministic procedural-map launch and renderer capture automation. Kept
# separate from `dev` so review packs exercise an otherwise release-shaped build.
map-review = []
# Scripted visual walk: drive the screens from a RON step list and photograph
# each one, so an agent or a human can review the frames. Same release-shaped
# philosophy as map-review.
visual-walk = ["hex_ui/visual-review", "hex_ui/test-support"]
# Headless game/UI observation helpers. Never enabled by the shipping build.
test-support = [
    "hex_assets/test-support",
    "hex_core/test-support",
    "hex_ui/test-support",
    "hex_world/test-support",
]

[[test]]
name = "game_content_contracts"
path = "tests/game_content_contracts.rs"

[[test]]
name = "gameplay_app"
path = "tests/gameplay_app.rs"
required-features = ["test-support"]

[lints]
workspace = true
