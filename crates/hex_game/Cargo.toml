[package]
name = "hex_game"
version.workspace = true
edition.workspace = true
publish = false
description = "The game binary: app setup, plugin wiring, screens and menus."

[dependencies]
bevy = { workspace = true }
hex_assets = { workspace = true }
hex_combat = { workspace = true }
hex_core = { workspace = true }
hex_lattice = { workspace = true }
hex_units = { workspace = true }
hex_map = { workspace = true }
hex_world = { workspace = true }
hex_dev = { workspace = true, optional = true }

[dev-dependencies]
# Only for the tests that open each scenario's world file and check it parses.
ron = "0.12.2"

[features]
# Empty by default so `cargo build --release` ships without the inspector. Use
# `cargo dev` (aliased in .cargo/config.toml) for a build with dev tooling.
default = []
# Development tooling: world inspector, debug overlays, and live asset reload so
# editing a file under assets/config/ takes effect without restarting.
dev = ["dep:hex_dev", "bevy/file_watcher"]
# Deterministic procedural-map launch and renderer capture automation. Kept
# separate from `dev` so review packs exercise an otherwise release-shaped build.
map-review = []

[lints]
workspace = true
