[package]
name = "hex_combat"
version.workspace = true
edition.workspace = true
publish = false
description = "The gameplay loop: real time until something happens, then turns."

# Depends on hex_units, which is a layer rather than a sibling -- a turn order is a
# fact *about* units, so it cannot be expressed without them. The sibling rule that
# keeps hex_map, hex_world and hex_units apart still holds; this is not an exception
# to it, it is a level above it.
[dependencies]
bevy = { workspace = true }
# For `Transformation` only: a turn must not end while its unit is still mid-stride,
# and the absence of that component is what "finished moving" means.
hex_anim = { workspace = true }
hex_ai = { workspace = true }
# For the substance table and the movement speed, both of which the AI needs to
# work out where it can walk and how fast to animate getting there.
hex_assets = { workspace = true }
hex_core = { workspace = true }
# The knowledge seam holds lattice facts, so it needs the lattice vocabulary. This
# edge is the designed one -- `hex_core -> hex_lattice` is the dependency direction,
# so `hex_core` cannot see `LatticeState`, and a store of lattice knowledge therefore
# cannot live there. It had simply not been drawn yet.
hex_lattice = { workspace = true }
# Spatial observation is world-owned. Combat consumes its published faction
# knowledge to decide whether a lattice view may be exposed; it does not derive
# visibility from combat entities.
hex_perception = { workspace = true }
hex_units = { workspace = true }
serde = { workspace = true }
xxhash-rust = { workspace = true }

[dev-dependencies]
serde_json = "1"

[lints]
workspace = true
