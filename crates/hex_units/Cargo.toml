[package]
name = "hex_units"
version.workspace = true
edition.workspace = true
publish = false
description = "The things that stand on the map: bodies, positions, and where they may step."

# Must NOT depend on hex_world or hex_map. The three talk through components and
# states defined in hex_core; cargo is what enforces that.
[dependencies]
bevy = { workspace = true }
hex_anim = { workspace = true }
hex_ai = { workspace = true }
hex_assets = { workspace = true }
hex_core = { workspace = true }
# A unit carries its lattice. `LatticeSpec`/`LatticeState`/`LatticeStats` go on at spawn,
# keyed by archetype — an enemy's lattice is its entire stat block, so this is not a
# decoration on a unit, it is most of what one is.
hex_lattice = { workspace = true }
serde = { workspace = true }

[dev-dependencies]
ron = { workspace = true }
serde_json = "1"

[lints]
workspace = true
