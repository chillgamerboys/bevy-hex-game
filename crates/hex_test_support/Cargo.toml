[package]
name = "hex_test_support"
version.workspace = true
edition.workspace = true
publish = false
description = "Dependency-limited synthetic fixtures for gameplay-owned headless tests."

# This dependency ceiling is intentional. The crate publishes only the component
# contracts that gameplay consumes; it cannot import either their producers
# (`hex_map`, `hex_world`, `hex_perception`) or their consumers (`hex_units`,
# `hex_combat`, `hex_game`).
[dependencies]
bevy = { workspace = true }
hex_assets = { workspace = true }
hex_core = { workspace = true }

[lints]
workspace = true
