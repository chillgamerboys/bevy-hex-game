[package]
name = "hex_lattice"
version.workspace = true
edition.workspace = true
publish = false
description = "The lattice: the game's core rules engine — gems, fusions, spells, mana, disables and enchantments as a pure, deterministic, serializable core with no App, no plugin and no renderer."

# Built like `hex_core`: Bevy sub-crates only (no `bevy` facade), no `App`, no
# renderer, so the property suite runs headless in milliseconds.
[dependencies]
hex_core = { workspace = true }
bevy_ecs = { workspace = true, features = ["bevy_reflect"] }
bevy_reflect = { workspace = true }
# Bridge: HEX-6 hoists `serde` into `[workspace.dependencies]`; until then it is
# pinned inline exactly as `hex_assets` already does. Switch to `workspace = true`
# when rebasing onto HEX-6.
serde = { version = "1.0.229", features = ["derive"] }

[dev-dependencies]
# Seeded generators for the randomised property tests — deterministic, no new
# third-party surface (proptest was considered and declined; see the crate docs).
rand = { workspace = true }
# The serde round-trip property tests exercise the actual authoring format. RON
# (unlike JSON) serializes maps with struct keys, which a `LatticeSpec`'s
# `BTreeMap<LatticeCoord, _>` needs.
ron = "0.12.2"

[lints]
workspace = true
