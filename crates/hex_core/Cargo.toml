[package]
name = "hex_core"
version.workspace = true
edition.workspace = true
publish = false
description = "Shared vocabulary and pure domain logic: hex coordinates, voxels, movement contracts, app states."

# Deliberately depends on Bevy's sub-crates rather than the `bevy` facade: this
# crate has no rendering and no `App`, so it must stay buildable and testable
# without pulling in a renderer. Anything needing `bevy::prelude` belongs in the
# higher-level crate that owns the behavior instead.
[dependencies]
bevy_ecs = { workspace = true, features = ["bevy_reflect"] }
bevy_math = { workspace = true }
bevy_platform = { workspace = true }
bevy_reflect = { workspace = true }
bevy_state = { version = "0.19", default-features = false, features = ["bevy_app", "bevy_reflect"] }
hexx = { version = "0.24", default-features = false, features = ["algorithms", "grid"] }
rand = { workspace = true }
# Bridge (HEX-6 owns this): serde is not yet a workspace dependency, so it is
# pinned inline as `hex_assets` already does. HEX-6 hoists it into
# `[workspace.dependencies]` and this becomes `serde = { workspace = true }`. It is
# here for the `lattice_ids`/`elements` id newtypes, which round-trip in a
# `LatticeSpec`.
serde = { version = "1.0.229", features = ["derive"] }
xxhash-rust = { workspace = true }

[lints]
workspace = true
