[package]
name = "hex_assets"
version.workspace = true
edition.workspace = true
publish = false
description = "RON asset definitions, loaders, and load tracking."

[dependencies]
bevy = { workspace = true }
hex_ai = { workspace = true }
hex_core = { workspace = true }
# The engine's designed seat, per architecture.md: this crate implements `Tables` over
# `elements.ron`/`spells.ron` and turns authored lattices into `LatticeSpec`, so the
# engine reads content without knowing what a file is.
hex_lattice = { workspace = true }
ron = { workspace = true }
serde = { workspace = true }
thiserror = "2.0.19"

[dev-dependencies]
# Parses the glTF JSON chunk so a test can check the geometry constants against
# the actual mesh. Dev-only; never shipped.
serde_json = "1"

[lints]
workspace = true
