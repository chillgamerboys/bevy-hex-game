[package]
name = "hex_dev"
version.workspace = true
edition.workspace = true
publish = false
description = "Development tooling: the world inspector. Compiled only when the `dev` feature is on."

# Isolated here so bevy-inspector-egui — historically the slowest crate in the
# ecosystem to follow a Bevy release — can never block shipping a build.
[dependencies]
bevy = { workspace = true, features = ["bevy_dev_tools", "bevy_ui_debug"] }
bevy-inspector-egui = { workspace = true }

[lints]
workspace = true
