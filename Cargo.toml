[workspace]
resolver = "3"
members = ["crates/*"]
default-members = ["crates/hex_game"]

# Dependency versions live here so the crates can't drift apart. Each crate
# opts in with `foo = { workspace = true }` and states its own features.
[workspace.dependencies]
hex_core = { path = "crates/hex_core" }
hex_lattice = { path = "crates/hex_lattice" }
hex_assets = { path = "crates/hex_assets" }
hex_objects = { path = "crates/hex_objects" }
hex_anim = { path = "crates/hex_anim" }
hex_ai = { path = "crates/hex_ai" }
hex_combat = { path = "crates/hex_combat" }
hex_world = { path = "crates/hex_world" }
hex_units = { path = "crates/hex_units" }
hex_map = { path = "crates/hex_map" }
hex_perception = { path = "crates/hex_perception" }
hex_dev = { path = "crates/hex_dev" }

bevy = "0.19"
bevy_app = "0.19"
bevy_ecs = "0.19"
bevy_log = "0.19"
bevy_math = "0.19"
bevy_platform = "0.19"
bevy_reflect = "0.19"
bevy_state = "0.19"
bevy-inspector-egui = "0.37"
bevy_egui = { version = "0.40.1", default-features = false, features = [
    "bevy_ui",
    "default_fonts",
    "picking",
    "render",
] }
atomicwrites = "0.4.4"
image = { version = "0.25.10", default-features = false, features = ["png"] }
rand = "0.8.5"
ron = "0.12.2"
xxhash-rust = { version = "0.8.6", features = ["xxh3"] }
serde = { version = "1.0.229", features = ["derive"] }

[workspace.package]
version = "0.3.0"
edition = "2021"

[workspace.lints.rust]
# `bevy_lint` sets this cfg when it runs. Declaring it keeps the compiler from
# warning about an unknown cfg, and means the linter can be switched on with no
# source changes. It does not support Bevy 0.19 yet (0.18 is its ceiling), so it
# is not wired into CI; this is here so it costs nothing to adopt when it lands.
unexpected_cfgs = { level = "warn", check-cfg = ["cfg(bevy_lint)"] }
# Public API has to be documented. This is a game whose map is owned by someone
# who does not write Rust, working through an AI agent -- undocumented public
# items are the difference between a boundary they can use and one they have to
# reverse-engineer.
missing_docs = "deny"
# Nothing here needs unsafe, and an agent reaching for it is a red flag rather
# than an optimisation. `forbid` cannot be overridden by an attribute.
unsafe_code = "forbid"

# ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~
# Clippy
#
# These are calibrated for a codebase substantially written by AI agents. An
# agent produces code sequentially, without the accumulated sense of a codebase
# that stops a human reaching for `unwrap()` in a system that runs every frame.
# Lints are cheaper than review for exactly that class of mistake.
#
# See <https://emschwartz.me/your-clippy-config-should-be-stricter/>.
# ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~
[workspace.lints.clippy]

# --- The two that make the rest enforceable -----------------------------------
#
# Without these, an agent that cannot satisfy a lint silences it and moves on,
# and every rule below becomes advisory. Together they require every suppression
# to be `#[expect(lint, reason = "...")]` with a real justification.
#
# `#[expect]` also warns when the lint stops firing, so a suppression that has
# outlived its cause surfaces instead of quietly accumulating.
allow_attributes = "deny"
allow_attributes_without_reason = "deny"

# --- Don't panic --------------------------------------------------------------
#
# A panic in a Bevy system takes the whole app down mid-frame. `indexing_slicing`
# matters most for grid code, which is full of array access.
unwrap_used = "deny"
get_unwrap = "deny"
unwrap_in_result = "deny"
indexing_slicing = "deny"
panic = "deny"
todo = "deny"
unimplemented = "deny"
panic_in_result_fn = "deny"
# `expect` stays a warning rather than an error: there are honest uses (an asset
# whose shape is guaranteed by the build), and denying it only pushes people back
# to `unwrap`, which is worse because it says nothing about why.
expect_used = "warn"

# --- Don't get numbers wrong --------------------------------------------------
#
# Terrain and transforms are float-heavy, and quantized heights cross to and from
# floats constantly. `float_cmp` catches the classic `height == 0.0`.
float_cmp = "deny"
lossy_float_literal = "deny"
cast_possible_truncation = "warn"
cast_precision_loss = "warn"
cast_sign_loss = "warn"

# --- Don't fail silently ------------------------------------------------------
let_underscore_must_use = "deny"
unused_result_ok = "deny"
map_err_ignore = "deny"

# --- Don't leave debris -------------------------------------------------------
#
# The codebase logs through Bevy's `info!`/`warn!`, which respect log levels and
# show up in release builds. `println!` does neither.
dbg_macro = "deny"
print_stdout = "deny"
print_stderr = "deny"

# --- Bevy-shaped exceptions ---------------------------------------------------
#
# Bevy injects system arguments by dependency injection, so systems routinely and
# correctly take more than seven parameters.
too_many_arguments = "allow"
# Queries are type-heavy by construction; the lint fires on ordinary Bevy code.
type_complexity = "allow"
nonstandard_macro_braces = "warn"

# Warning levels for individual Bevy lints go here once bevy_lint supports 0.19.
# <https://thebevyflock.github.io/bevy_cli/api/bevy_lint/lints/>
[workspace.metadata.bevy_lint]
# panicking_methods = "deny"

# Enable a small amount of optimization in debug mode
[profile.dev]
opt-level = 1

# Enable high optimizations for dependencies (incl. Bevy), but not for our code:
[profile.dev.package."*"]
opt-level = 3

# wgpu's debug assertions are expensive enough to distort dev-build profiling.
# <https://github.com/bevyengine/bevy/issues/14291>
[profile.dev.package.wgpu-types]
debug-assertions = false

[profile.release]
# Whole-program optimization. Costs compile time; this is the profile we ship,
# so that trade is the right way round.
codegen-units = 1
lto = "thin"

# Fast to compile, since CI only needs to know the code builds and passes.
[profile.ci]
inherits = "dev"
opt-level = 0
debug = "line-tables-only"
codegen-units = 4

[profile.ci.package."*"]
opt-level = 0
