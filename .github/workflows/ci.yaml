name: CI

on:
  pull_request:
  # `dev` is the integration branch every PR targets, so it needs post-merge cover
  # as much as `main` does. This said `[main, refactor]` for months after `refactor`
  # was deleted, which meant no merge into `dev` ran CI at all.
  push:
    branches: [main, dev]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  # Fail fast and keep logs readable rather than emitting incremental artefacts
  # CI immediately throws away.
  CARGO_INCREMENTAL: 0

jobs:
  # Is there anything here a Rust build could possibly care about?
  #
  # Markdown cannot break a build. Everything else can, including doc comments
  # inside `.rs` files: `missing_docs` is denied and `cargo doc` runs with
  # `-D warnings`, so a "documentation" change to Rust is still a code change.
  #
  # **Fails safe.** Anything unexpected — a force push, an unknown event, a diff
  # that cannot be computed — reports `code=true` and runs the full suite. Wasting
  # ten minutes is cheap; skipping the run that would have caught something is not.
  changes:
    name: Detect changes
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      code: ${{ steps.filter.outputs.code }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - id: filter
        run: |
          set -u
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            git fetch --no-tags origin "${{ github.base_ref }}" || true
            changed=$(git diff --name-only "origin/${{ github.base_ref }}...HEAD" 2>/dev/null) || changed=""
          else
            before="${{ github.event.before }}"
            case "$before" in
              ''|0000000000000000000000000000000000000000) changed="" ;;
              *) changed=$(git diff --name-only "$before" "${{ github.sha }}" 2>/dev/null) || changed="" ;;
            esac
          fi

          if [ -z "$changed" ]; then
            echo "could not determine the diff; running everything"
            echo "code=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "changed files:"; echo "$changed"
          if echo "$changed" | grep -qv '\.md$'; then
            echo "code=true" >> "$GITHUB_OUTPUT"
          else
            echo "markdown only; skipping the Rust build"
            echo "code=false" >> "$GITHUB_OUTPUT"
          fi

  # Formatting and licensing need no Bevy build, so they report in seconds
  # instead of waiting behind a ~10 minute compile.
  #
  # Note every job below is *always* entered and only its expensive steps are
  # conditional, rather than the job itself being skipped. A job skipped by an
  # `if` reports the conclusion "skipped", and whether that satisfies a required
  # status check is a detail nobody should have to remember. Always reporting
  # success is unambiguous, and the wasted runner time is a few seconds.
  quick:
    name: Format and dependencies
    needs: changes
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5

      # Docs are a deliverable here — the map is owned by someone who does not
      # write Rust — and nothing else in this pipeline reads a word of Markdown.
      # A link rotting is the way these files actually break: `Exposed` outlived
      # the type it named because `cargo doc` does not check integration tests.
      # Relative links only; external URLs make CI fail for other people's outages.
      - name: Check relative links in Markdown
        run: |
          set -u
          broken=$(mktemp)
          while IFS= read -r file; do
            dir=$(dirname "$file")
            grep -oE '\]\([^)#][^)]*\)' "$file" 2>/dev/null \
              | sed -E 's/^\]\(//; s/\)$//; s/#.*$//' \
              | grep -vE '^[a-z]+:' \
              | while IFS= read -r link; do
                  [ -z "$link" ] && continue
                  [ -e "$dir/$link" ] || echo "BROKEN: $file -> $link"
                done
          done < <(git ls-files '*.md') > "$broken"
          if [ -s "$broken" ]; then cat "$broken"; exit 1; fi
          echo "all relative links resolve"

      - uses: dtolnay/rust-toolchain@stable
        if: needs.changes.outputs.code == 'true'
        with:
          components: rustfmt
      - run: cargo fmt --all --check
        if: needs.changes.outputs.code == 'true'
      - uses: EmbarkStudios/cargo-deny-action@v2
        if: needs.changes.outputs.code == 'true'
        with:
          command: check

  test:
    name: Clippy and tests
    needs: changes
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
        if: needs.changes.outputs.code == 'true'
      - uses: dtolnay/rust-toolchain@stable
        if: needs.changes.outputs.code == 'true'
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
        if: needs.changes.outputs.code == 'true'
      - uses: taiki-e/install-action@nextest
        if: needs.changes.outputs.code == 'true'
      # Bevy needs these to build on Linux even for a check-only run.
      - name: Install Linux dependencies
        if: needs.changes.outputs.code == 'true'
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y \
            libasound2-dev libudev-dev libwayland-dev libxkbcommon-dev
      # Package isolation catches missing direct-dependency features that workspace
      # feature unification can otherwise hide.
      - run: cargo check --package hex_core --profile ci
        if: needs.changes.outputs.code == 'true'
      # --all-features so hex_dev is linted too; it is excluded from a default build.
      - run: cargo clippy --workspace --all-targets --all-features --profile ci -- -D warnings
        if: needs.changes.outputs.code == 'true'
      - name: Run ordinary tests with per-test timing
        if: needs.changes.outputs.code == 'true'
        shell: bash
        run: |
          set -o pipefail
          {
            time cargo nextest run \
              --workspace \
              --all-features \
              --cargo-profile ci \
              --profile ci \
              -E 'not (package(hex_core) | package(hex_lattice) | package(hex_ai) | package(hex_units) | package(hex_combat) | package(hex_test_support) | (package(hex_game) & binary(gameplay_app)))'
            # Nextest deliberately does not execute doctests.
            time cargo test --workspace --all-features --profile ci --doc
          } 2>&1 | tee test-timing.log
      - name: Upload test timing artifacts
        if: always() && needs.changes.outputs.code == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: workspace-test-timings
          path: |
            test-timing.log
            target/nextest/ci/junit.xml
          if-no-files-found: error

  # Rustdoc is a separate bounded deliverable. Keeping it in the test job caused
  # two consecutive otherwise-green runs to hit the exact 30-minute ceiling only
  # after Clippy and all ordinary tests had passed.
  docs:
    name: Documentation
    needs: changes
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
        if: needs.changes.outputs.code == 'true'
      - uses: dtolnay/rust-toolchain@stable
        if: needs.changes.outputs.code == 'true'
      - uses: Swatinem/rust-cache@v2
        if: needs.changes.outputs.code == 'true'
      - name: Install Linux dependencies
        if: needs.changes.outputs.code == 'true'
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y \
            libasound2-dev libudev-dev libwayland-dev libxkbcommon-dev
      # Docs are a deliverable here, not a nicety: the map is owned by someone who
      # does not write Rust. A broken intra-doc link is a broken handoff.
      #
      # This does *not* cover doc comments in `tests/` — rustdoc skips integration
      # tests — which is how a link to a deleted type survived a green pipeline.
      - run: cargo doc --workspace --no-deps --all-features
        if: needs.changes.outputs.code == 'true'
        env:
          RUSTDOCFLAGS: -D warnings

  gameplay:
    name: Gameplay partitions
    needs: changes
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
        if: needs.changes.outputs.code == 'true'
      - uses: dtolnay/rust-toolchain@stable
        if: needs.changes.outputs.code == 'true'
      - uses: Swatinem/rust-cache@v2
        if: needs.changes.outputs.code == 'true'
      - uses: taiki-e/install-action@nextest
        if: needs.changes.outputs.code == 'true'
      - name: Install Linux dependencies
        if: needs.changes.outputs.code == 'true'
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y \
            libasound2-dev libudev-dev libwayland-dev libxkbcommon-dev
      - name: Gameplay rules
        if: needs.changes.outputs.code == 'true'
        run: |
          set -o pipefail
          time cargo nextest run \
            --workspace \
            --all-features \
            --cargo-profile ci \
            --profile gameplay-rules 2>&1 | tee gameplay-rules-timing.log
      - name: Gameplay contracts
        if: needs.changes.outputs.code == 'true'
        run: |
          set -o pipefail
          time cargo nextest run \
            --workspace \
            --all-features \
            --cargo-profile ci \
            --profile gameplay-contracts 2>&1 | tee gameplay-contracts-timing.log
      - name: Gameplay simulation
        if: needs.changes.outputs.code == 'true'
        run: |
          set -o pipefail
          time cargo nextest run \
            --package hex_combat \
            --test simulation \
            --cargo-profile ci \
            --profile gameplay-simulation 2>&1 | tee gameplay-simulation-timing.log
      - name: Gameplay app
        if: needs.changes.outputs.code == 'true'
        run: |
          set -o pipefail
          time cargo nextest run \
            --package hex_game \
            --features test-support \
            --test gameplay_app \
            --cargo-profile ci \
            --profile gameplay-app 2>&1 | tee gameplay-app-timing.log
      - name: Upload gameplay timing artifacts
        if: always() && needs.changes.outputs.code == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: gameplay-test-timings
          path: |
            gameplay-*-timing.log
            target/nextest/gameplay-rules/junit.xml
            target/nextest/gameplay-contracts/junit.xml
            target/nextest/gameplay-simulation/junit.xml
            target/nextest/gameplay-app/junit.xml
          if-no-files-found: error

  # The three platforms we intend to ship. Catches target-specific breakage —
  # notably the Windows console subsystem attribute — before it reaches a release.
  build:
    name: Build (${{ matrix.os }})
    needs: changes
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v5
        if: needs.changes.outputs.code == 'true'
      - uses: dtolnay/rust-toolchain@stable
        if: needs.changes.outputs.code == 'true'
      - uses: Swatinem/rust-cache@v2
        if: needs.changes.outputs.code == 'true'
      - name: Install Linux dependencies
        if: runner.os == 'Linux' && needs.changes.outputs.code == 'true'
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y \
            libasound2-dev libudev-dev libwayland-dev libxkbcommon-dev
      # No --all-features and only the shipping package: this must not accidentally
      # validate a workspace-only development binary in place of the game.
      #
      # The Windows runner's MSVC linker spent more than ten minutes in the final
      # ThinLTO link and crossed this job's 30-minute ceiling. The runner ships
      # LLVM's MSVC-compatible linker; selecting it changes no Cargo profile or
      # package input and keeps the exact shipping build inside the same budget.
      - name: Record the Windows shipping linker
        if: runner.os == 'Windows' && needs.changes.outputs.code == 'true'
        shell: pwsh
        run: |
          $linker = Get-Command lld-link.exe -ErrorAction Stop
          & $linker.Source --version
      - name: Build the Windows shipping package
        if: runner.os == 'Windows' && needs.changes.outputs.code == 'true'
        env:
          CARGO_TARGET_X86_64_PC_WINDOWS_MSVC_LINKER: lld-link.exe
        run: cargo build --package hex_game --release
      - name: Build the shipping package
        if: runner.os != 'Windows' && needs.changes.outputs.code == 'true'
        run: cargo build --package hex_game --release

  coverage:
    name: Domain coverage
    needs: changes
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
        if: needs.changes.outputs.code == 'true'
      - uses: dtolnay/rust-toolchain@stable
        if: needs.changes.outputs.code == 'true'
        with:
          components: llvm-tools-preview
      - uses: Swatinem/rust-cache@v2
        if: needs.changes.outputs.code == 'true'
      - uses: taiki-e/install-action@cargo-llvm-cov
        if: needs.changes.outputs.code == 'true'
      - name: Install Linux dependencies
        if: needs.changes.outputs.code == 'true'
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y \
            libasound2-dev libudev-dev libwayland-dev libxkbcommon-dev
      - name: Measure headless domain coverage
        if: needs.changes.outputs.code == 'true'
        run: >-
          cargo llvm-cov
          --package hex_core
          --package hex_lattice
          --package hex_ai
          --package hex_perception
          --all-features
          --lcov
          --output-path coverage.lcov
      - name: Upload coverage
        if: always() && needs.changes.outputs.code == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: domain-coverage
          path: coverage.lcov
          if-no-files-found: error
