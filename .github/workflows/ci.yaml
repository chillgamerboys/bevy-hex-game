name: CI

on:
  pull_request:
  # `dev` is the integration branch every PR targets, so it needs post-merge cover
  # as much as `main` does. This said `[main, refactor]` for months after `refactor`
  # was deleted, which meant no merge into `dev` ran CI at all.
  push:
    branches: [main, dev]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  # Fail fast and keep logs readable rather than emitting incremental artefacts
  # CI immediately throws away.
  CARGO_INCREMENTAL: 0

jobs:
  # Is there anything here a Rust build could possibly care about?
  #
  # Markdown cannot break a build. Everything else can, including doc comments
  # inside `.rs` files: `missing_docs` is denied and `cargo doc` runs with
  # `-D warnings`, so a "documentation" change to Rust is still a code change.
  #
  # **Fails safe.** Anything unexpected — a force push, an unknown event, a diff
  # that cannot be computed — reports `code=true` and runs the full suite. Wasting
  # ten minutes is cheap; skipping the run that would have caught something is not.
  changes:
    name: Detect changes
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      code: ${{ steps.filter.outputs.code }}
      full: ${{ steps.filter.outputs.full }}
      rules: ${{ steps.filter.outputs.rules }}
      trajectory_contracts: ${{ steps.filter.outputs.trajectory_contracts }}
      contracts: ${{ steps.filter.outputs.contracts }}
      simulation: ${{ steps.filter.outputs.simulation }}
      app: ${{ steps.filter.outputs.app }}
      map_unit: ${{ steps.filter.outputs.map_unit }}
      map_generation: ${{ steps.filter.outputs.map_generation }}
      map_contracts: ${{ steps.filter.outputs.map_contracts }}
      residual: ${{ steps.filter.outputs.residual }}
      clippy: ${{ steps.filter.outputs.clippy }}
      docs: ${{ steps.filter.outputs.docs }}
      shipping: ${{ steps.filter.outputs.shipping }}
      reason: ${{ steps.filter.outputs.reason }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - id: filter
        run: |
          set -u
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            git fetch --no-tags origin "${{ github.base_ref }}" || true
            changed=$(git diff --name-only "origin/${{ github.base_ref }}...HEAD" 2>/dev/null) || changed=""
            force_full=()
          else
            before="${{ github.event.before }}"
            case "$before" in
              ''|0000000000000000000000000000000000000000) changed="" ;;
              *) changed=$(git diff --name-only "$before" "${{ github.sha }}" 2>/dev/null) || changed="" ;;
            esac
            force_full=(--force-full)
          fi

          echo "changed files:"
          printf '%s\n' "$changed"
          printf '%s\n' "$changed" > changed-files.txt
          python3 tools/test_scope.py plan \
            --paths-file changed-files.txt \
            "${force_full[@]}" \
            --json-out test-scope.json \
            --github-output "$GITHUB_OUTPUT"
          {
            echo '### Test scope decision'
            echo
            echo '```json'
            cat test-scope.json
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Test the fail-closed selector
        run: python3 tools/test_scope.py run selector
      - name: Upload scope decision
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-scope-decision
          path: test-scope.json
          if-no-files-found: error

  # Formatting and licensing need no Bevy build, so they report in seconds
  # instead of waiting behind a ~10 minute compile.
  #
  # Note every job below is *always* entered and only its expensive steps are
  # conditional, rather than the job itself being skipped. A job skipped by an
  # `if` reports the conclusion "skipped", and whether that satisfies a required
  # status check is a detail nobody should have to remember. Always reporting
  # success is unambiguous, and the wasted runner time is a few seconds.
  quick:
    name: Format and dependencies
    needs: changes
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5

      # Docs are a deliverable here — the map is owned by someone who does not
      # write Rust — and nothing else in this pipeline reads a word of Markdown.
      # A link rotting is the way these files actually break: `Exposed` outlived
      # the type it named because `cargo doc` does not check integration tests.
      # Relative links only; external URLs make CI fail for other people's outages.
      - name: Check relative links in Markdown
        run: |
          set -u
          broken=$(mktemp)
          while IFS= read -r file; do
            dir=$(dirname "$file")
            grep -oE '\]\([^)#][^)]*\)' "$file" 2>/dev/null \
              | sed -E 's/^\]\(//; s/\)$//; s/#.*$//' \
              | grep -vE '^[a-z]+:' \
              | while IFS= read -r link; do
                  [ -z "$link" ] && continue
                  [ -e "$dir/$link" ] || echo "BROKEN: $file -> $link"
                done
          done < <(git ls-files '*.md') > "$broken"
          if [ -s "$broken" ]; then cat "$broken"; exit 1; fi
          echo "all relative links resolve"

      - name: Check deprecated UI terminology
        run: python3 tools/check_deprecated_ui_terms.py

      - uses: dtolnay/rust-toolchain@stable
        if: needs.changes.outputs.code == 'true'
        with:
          components: rustfmt
      - run: cargo fmt --all --check
        if: needs.changes.outputs.code == 'true'
      - uses: EmbarkStudios/cargo-deny-action@v2
        if: needs.changes.outputs.code == 'true'
        with:
          command: check

  test:
    name: Clippy and tests
    needs: changes
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
        if: needs.changes.outputs.clippy == 'true' || needs.changes.outputs.residual == 'true'
      - uses: dtolnay/rust-toolchain@stable
        if: needs.changes.outputs.clippy == 'true' || needs.changes.outputs.residual == 'true'
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
        if: needs.changes.outputs.clippy == 'true' || needs.changes.outputs.residual == 'true'
      - uses: taiki-e/install-action@nextest
        if: needs.changes.outputs.residual == 'true'
      # Bevy needs these to build on Linux even for a check-only run.
      - name: Install Linux dependencies
        if: needs.changes.outputs.clippy == 'true' || needs.changes.outputs.residual == 'true'
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y \
            libasound2-dev libudev-dev libwayland-dev libxkbcommon-dev
      # Package isolation catches missing direct-dependency features that workspace
      # feature unification can otherwise hide.
      - run: cargo check --package hex_core --profile ci
        if: needs.changes.outputs.clippy == 'true'
      # --all-features so hex_dev is linted too; it is excluded from a default build.
      - run: cargo clippy --workspace --all-targets --all-features --profile ci -- -D warnings
        if: needs.changes.outputs.clippy == 'true'
      - name: Run ordinary tests with per-test timing
        if: needs.changes.outputs.residual == 'true'
        shell: bash
        run: |
          set -o pipefail
          {
            time python3 tools/test_scope.py run residual \
              --timing-out residual-timing.json
            # Nextest deliberately does not execute doctests.
            time cargo test --workspace --all-features --profile ci --doc
          } 2>&1 | tee test-timing.log
      - name: Upload test timing artifacts
        if: always() && needs.changes.outputs.residual == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: workspace-test-timings
          path: |
            test-timing.log
            residual-timing.json
            target/nextest/ci/junit.xml
          if-no-files-found: error

  # Map concerns share one job so the three logical partitions reuse the same
  # optimized hex_map build. Package and target selection happens before nextest
  # filters; every PR seed remains ordinary evidence.
  map_tests:
    name: Map partitions
    needs: changes
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
        if: needs.changes.outputs.map_unit == 'true' || needs.changes.outputs.map_generation == 'true' || needs.changes.outputs.map_contracts == 'true'
      - uses: dtolnay/rust-toolchain@stable
        if: needs.changes.outputs.map_unit == 'true' || needs.changes.outputs.map_generation == 'true' || needs.changes.outputs.map_contracts == 'true'
      - uses: Swatinem/rust-cache@v2
        if: needs.changes.outputs.map_unit == 'true' || needs.changes.outputs.map_generation == 'true' || needs.changes.outputs.map_contracts == 'true'
      - uses: taiki-e/install-action@nextest
        if: needs.changes.outputs.map_unit == 'true' || needs.changes.outputs.map_generation == 'true' || needs.changes.outputs.map_contracts == 'true'
      - name: Install Linux dependencies
        if: needs.changes.outputs.map_unit == 'true' || needs.changes.outputs.map_generation == 'true' || needs.changes.outputs.map_contracts == 'true'
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y \
            libasound2-dev libudev-dev libwayland-dev libxkbcommon-dev
      # Prove selection identity before spending minutes executing a partition.
      # The listing compiles the same targets, so subsequent runs reuse its output.
      - name: Preflight exhaustive map partitions
        if: needs.changes.outputs.full == 'true'
        run: python3 tools/test_scope.py check-partitions map
      - name: Map unit contracts
        if: needs.changes.outputs.map_unit == 'true'
        shell: bash
        run: |
          set -o pipefail
          python3 tools/test_scope.py run map_unit \
            --timing-out map-unit-timing.json \
            2>&1 | tee map-unit-timing.log
      - name: Map generation contracts
        if: needs.changes.outputs.map_generation == 'true'
        shell: bash
        run: |
          set -o pipefail
          python3 tools/test_scope.py run map_generation \
            --timing-out map-generation-timing.json \
            2>&1 | tee map-generation-timing.log
      - name: Map publication contracts
        if: needs.changes.outputs.map_contracts == 'true'
        shell: bash
        run: |
          set -o pipefail
          python3 tools/test_scope.py run map_contracts \
            --timing-out map-contracts-timing.json \
            2>&1 | tee map-contracts-timing.log
      - name: Upload map timing artifacts
        if: always() && (needs.changes.outputs.map_unit == 'true' || needs.changes.outputs.map_generation == 'true' || needs.changes.outputs.map_contracts == 'true')
        uses: actions/upload-artifact@v4
        with:
          name: map-test-timings
          path: |
            map-*-timing.log
            map-*-timing.json
            target/nextest/map-unit/junit.xml
            target/nextest/map-generation/junit.xml
            target/nextest/map-contracts/junit.xml
          if-no-files-found: error

  # Rustdoc is a separate bounded deliverable. Keeping it in the test job caused
  # two consecutive otherwise-green runs to hit the exact 30-minute ceiling only
  # after Clippy and all ordinary tests had passed.
  docs:
    name: Documentation
    needs: changes
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
        if: needs.changes.outputs.docs == 'true' && needs.changes.outputs.code == 'true'
      - uses: dtolnay/rust-toolchain@stable
        if: needs.changes.outputs.docs == 'true' && needs.changes.outputs.code == 'true'
      - uses: Swatinem/rust-cache@v2
        if: needs.changes.outputs.docs == 'true' && needs.changes.outputs.code == 'true'
      - name: Install Linux dependencies
        if: needs.changes.outputs.docs == 'true' && needs.changes.outputs.code == 'true'
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y \
            libasound2-dev libudev-dev libwayland-dev libxkbcommon-dev
      # Docs are a deliverable here, not a nicety: the map is owned by someone who
      # does not write Rust. A broken intra-doc link is a broken handoff.
      #
      # This does *not* cover doc comments in `tests/` — rustdoc skips integration
      # tests — which is how a link to a deleted type survived a green pipeline.
      - run: cargo doc --workspace --no-deps --all-features
        if: needs.changes.outputs.docs == 'true' && needs.changes.outputs.code == 'true'
        env:
          RUSTDOCFLAGS: -D warnings

  gameplay:
    name: Gameplay partitions
    needs: changes
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
        if: needs.changes.outputs.rules == 'true' || needs.changes.outputs.trajectory_contracts == 'true' || needs.changes.outputs.contracts == 'true' || needs.changes.outputs.simulation == 'true' || needs.changes.outputs.app == 'true'
      - uses: dtolnay/rust-toolchain@stable
        if: needs.changes.outputs.rules == 'true' || needs.changes.outputs.trajectory_contracts == 'true' || needs.changes.outputs.contracts == 'true' || needs.changes.outputs.simulation == 'true' || needs.changes.outputs.app == 'true'
      - uses: Swatinem/rust-cache@v2
        if: needs.changes.outputs.rules == 'true' || needs.changes.outputs.trajectory_contracts == 'true' || needs.changes.outputs.contracts == 'true' || needs.changes.outputs.simulation == 'true' || needs.changes.outputs.app == 'true'
      - uses: taiki-e/install-action@nextest
        if: needs.changes.outputs.rules == 'true' || needs.changes.outputs.trajectory_contracts == 'true' || needs.changes.outputs.contracts == 'true' || needs.changes.outputs.simulation == 'true' || needs.changes.outputs.app == 'true'
      - name: Install Linux dependencies
        if: needs.changes.outputs.rules == 'true' || needs.changes.outputs.trajectory_contracts == 'true' || needs.changes.outputs.contracts == 'true' || needs.changes.outputs.simulation == 'true' || needs.changes.outputs.app == 'true'
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y \
            libasound2-dev libudev-dev libwayland-dev libxkbcommon-dev
      - name: Gameplay rules
        if: needs.changes.outputs.rules == 'true'
        shell: bash
        run: |
          set -o pipefail
          python3 tools/test_scope.py check-graph rules
          python3 tools/test_scope.py run rules \
            --timing-out gameplay-rules-timing.json \
            2>&1 | tee gameplay-rules-timing.log
      - name: Gameplay contracts
        if: needs.changes.outputs.contracts == 'true'
        shell: bash
        run: |
          set -o pipefail
          python3 tools/test_scope.py run contracts \
            --timing-out gameplay-contracts-timing.json \
            2>&1 | tee gameplay-contracts-timing.log
      - name: Trajectory and volume contracts
        if: needs.changes.outputs.trajectory_contracts == 'true'
        shell: bash
        run: |
          set -o pipefail
          python3 tools/test_scope.py run trajectory_contracts \
            --timing-out gameplay-trajectory-timing.json \
            2>&1 | tee gameplay-trajectory-timing.log
      - name: Gameplay simulation
        if: needs.changes.outputs.simulation == 'true'
        shell: bash
        run: |
          set -o pipefail
          python3 tools/test_scope.py check-graph simulation
          python3 tools/test_scope.py run simulation \
            --timing-out gameplay-simulation-timing.json \
            2>&1 | tee gameplay-simulation-timing.log
      - name: Gameplay app
        if: needs.changes.outputs.app == 'true'
        shell: bash
        run: |
          set -o pipefail
          python3 tools/test_scope.py run app \
            --timing-out gameplay-app-timing.json \
            2>&1 | tee gameplay-app-timing.log
      - name: Upload gameplay timing artifacts
        if: always() && (needs.changes.outputs.rules == 'true' || needs.changes.outputs.trajectory_contracts == 'true' || needs.changes.outputs.contracts == 'true' || needs.changes.outputs.simulation == 'true' || needs.changes.outputs.app == 'true')
        uses: actions/upload-artifact@v4
        with:
          name: gameplay-test-timings
          path: |
            gameplay-*-timing.log
            gameplay-*-timing.json
            target/nextest/gameplay-rules/junit.xml
            target/nextest/gameplay-trajectory/junit.xml
            target/nextest/gameplay-contracts/junit.xml
            target/nextest/gameplay-simulation/junit.xml
            target/nextest/gameplay-app/junit.xml
          if-no-files-found: error

  # The two Unix platforms we intend to ship. A cold macOS ThinLTO build sits at
  # the old 30-minute whole-job ceiling, so retain enough room for the exact
  # shipping build and its cache post-save. Windows keeps the split build below.
  build:
    name: Build (${{ matrix.os }})
    needs: changes
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v5
        if: needs.changes.outputs.shipping == 'true'
      - uses: dtolnay/rust-toolchain@stable
        if: needs.changes.outputs.shipping == 'true'
      - uses: Swatinem/rust-cache@v2
        if: needs.changes.outputs.shipping == 'true'
      - name: Install Linux dependencies
        if: runner.os == 'Linux' && needs.changes.outputs.shipping == 'true'
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y \
            libasound2-dev libudev-dev libwayland-dev libxkbcommon-dev
      # No --all-features and only the shipping package: this must not accidentally
      # validate a workspace-only development binary in place of the game.
      - name: Build the shipping package
        if: needs.changes.outputs.shipping == 'true'
        run: cargo build --package hex_game --release

  # A cold Windows cache consistently reached `hex_game` after about 15 minutes,
  # then the release ThinLTO compile/link crossed the 30-minute job ceiling before
  # rust-cache could publish its work. Prime the shipping dependency graph in one
  # bounded job, then restore it into the unchanged exact package build below.
  windows_dependencies:
    name: Prime Windows shipping dependencies
    needs: changes
    runs-on: windows-latest
    timeout-minutes: 30
    env:
      CARGO_TARGET_X86_64_PC_WINDOWS_MSVC_LINKER: lld-link.exe
    steps:
      - uses: actions/checkout@v5
        if: needs.changes.outputs.shipping == 'true'
      - uses: dtolnay/rust-toolchain@stable
        if: needs.changes.outputs.shipping == 'true'
      - uses: Swatinem/rust-cache@v2
        if: needs.changes.outputs.shipping == 'true'
        with:
          shared-key: windows-shipping
      - name: Record the Windows shipping linker
        if: needs.changes.outputs.shipping == 'true'
        shell: pwsh
        run: |
          $linker = Get-Command lld-link.exe -ErrorAction Stop
          & $linker.Source --version
      - name: Build the Windows shipping dependency graph
        if: needs.changes.outputs.shipping == 'true'
        run: >-
          cargo build --release
          --package hex_assets
          --package hex_objects
          --package hex_combat
          --package hex_core
          --package hex_lattice
          --package hex_units
          --package hex_map
          --package hex_perception
          --package hex_world

  windows:
    name: Build (windows-latest)
    needs: [changes, windows_dependencies]
    runs-on: windows-latest
    timeout-minutes: 30
    env:
      CARGO_TARGET_X86_64_PC_WINDOWS_MSVC_LINKER: lld-link.exe
    steps:
      - uses: actions/checkout@v5
        if: needs.changes.outputs.shipping == 'true'
      - uses: dtolnay/rust-toolchain@stable
        if: needs.changes.outputs.shipping == 'true'
      - uses: Swatinem/rust-cache@v2
        if: needs.changes.outputs.shipping == 'true'
        with:
          shared-key: windows-shipping
          save-if: false
      # Keep the exact shipping validation command unchanged. The preceding job
      # alters only cache availability, never the release profile or package input.
      - name: Build the Windows shipping package
        if: needs.changes.outputs.shipping == 'true'
        run: cargo build --package hex_game --release

  coverage:
    name: Domain coverage
    needs: changes
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
        if: needs.changes.outputs.full == 'true'
      - uses: dtolnay/rust-toolchain@stable
        if: needs.changes.outputs.full == 'true'
        with:
          components: llvm-tools-preview
      - uses: Swatinem/rust-cache@v2
        if: needs.changes.outputs.full == 'true'
      - uses: taiki-e/install-action@cargo-llvm-cov
        if: needs.changes.outputs.full == 'true'
      - name: Install Linux dependencies
        if: needs.changes.outputs.full == 'true'
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y \
            libasound2-dev libudev-dev libwayland-dev libxkbcommon-dev
      - name: Measure headless domain coverage
        if: needs.changes.outputs.full == 'true'
        run: >-
          cargo llvm-cov
          --package hex_core
          --package hex_lattice
          --package hex_ai
          --package hex_combat_core
          --package hex_perception
          --all-features
          --lcov
          --output-path coverage.lcov
      - name: Upload coverage
        if: always() && needs.changes.outputs.full == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: domain-coverage
          path: coverage.lcov
          if-no-files-found: error
