name: Deep checks

on:
  pull_request:
    paths:
      - Cargo.toml
      - Cargo.lock
      - crates/hex_core/**
      - crates/hex_ai/**
      - crates/hex_lattice/**
      - .github/workflows/deep-checks.yaml
  workflow_dispatch:
  schedule:
    - cron: "43 8 * * 4"

concurrency:
  group: deep-checks-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0

jobs:
  miri:
    name: Pure rules under Miri
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@nightly
        with:
          components: miri
      - uses: Swatinem/rust-cache@v2
        with:
          key: miri
      - name: Prepare Miri
        run: cargo miri setup
      - name: Interpret pure domain suites
        run: >-
          cargo miri test
          --lib
          --tests
          --package hex_core
          --package hex_lattice
          --package hex_ai

  address-sanitizer:
    name: Headless AddressSanitizer
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@nightly
        with:
          components: rust-src
          targets: x86_64-unknown-linux-gnu
      - uses: Swatinem/rust-cache@v2
        with:
          key: address-sanitizer
      - name: Run instrumented headless suites
        env:
          RUSTFLAGS: -Zsanitizer=address
          ASAN_OPTIONS: detect_leaks=1
        run: >-
          cargo test
          -Zbuild-std
          --target x86_64-unknown-linux-gnu
          --lib
          --tests
          --package hex_core
          --package hex_lattice
          --package hex_ai
