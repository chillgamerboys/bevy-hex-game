name: Release

# Builds normalized pre-alpha artifacts and attaches them to a GitHub release.
# Signing, notarization, Steam upload, and crash-reporting credentials are reserved
# in docs/development/release.md; this workflow deliberately uses none of them yet.
on:
  push:
    tags: ["v*"]
  # Lets you produce a build from any branch without cutting a tag.
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  # Embedded into disposable resume data so a release build never accepts another
  # build's slot merely because both still report the same pre-alpha semver.
  HEX_GAME_BUILD_ID: ${{ github.sha }}

permissions:
  contents: write

jobs:
  build:
    name: ${{ matrix.platform }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux-x86_64
            os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            source_binary: hex_game
            packaged_binary: hex-game
          - platform: windows-x86_64
            os: windows-latest
            target: x86_64-pc-windows-msvc
            source_binary: hex_game.exe
            packaged_binary: hex-game.exe
          - platform: macos-aarch64
            os: macos-latest
            target: aarch64-apple-darwin
            source_binary: hex_game
            packaged_binary: hex-game
          - platform: macos-x86_64
            os: macos-latest
            target: x86_64-apple-darwin
            source_binary: hex_game
            packaged_binary: hex-game
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          # Keep this aligned with rust-toolchain.toml so cross-target standard
          # libraries are installed into the toolchain Cargo actually selects.
          toolchain: 1.97.1
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y \
            libasound2-dev libudev-dev libwayland-dev libxkbcommon-dev

      # Default features deliberately: no `dev`, so no inspector and no console
      # window on Windows.
      - name: Build
        run: cargo build --release --target ${{ matrix.target }} --package hex_game

      # Assets sit beside the binary because a standalone executable resolves its
      # asset root from its own directory, not from a manifest.
      - name: Stage
        shell: bash
        run: |
          package="dist/hex-game"
          release_dir="target/${{ matrix.target }}/release"
          mkdir -p "$package/symbols"
          cp "$release_dir/${{ matrix.source_binary }}" "$package/${{ matrix.packaged_binary }}"
          cp -r assets "$package/"
          cp assets/ui/app-icon.png "$package/app-icon.png"
          cp README.md "$package/"
          find "$release_dir" -maxdepth 1 \
            \( -name '*.pdb' -o -name '*.dSYM' -o -name '*.dwp' \) \
            -exec cp -R {} "$package/symbols/" \;
          if [ -z "$(find "$package/symbols" -mindepth 1 -maxdepth 1 -print -quit)" ]; then
            rmdir "$package/symbols"
          fi

      - name: Archive
        shell: bash
        working-directory: dist
        run: |
          if [ "${{ runner.os }}" = "Windows" ]; then
            7z a "hex-game-${{ matrix.platform }}.zip" hex-game
          else
            tar -czf "hex-game-${{ matrix.platform }}.tar.gz" hex-game
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: hex-game-${{ matrix.platform }}
          path: |
            dist/*.zip
            dist/*.tar.gz
          if-no-files-found: error

      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.zip
            dist/*.tar.gz
