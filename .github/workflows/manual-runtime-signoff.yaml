name: Manual runtime sign-off

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review, converted_to_draft, edited]

concurrency:
  group: manual-runtime-signoff-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: read

jobs:
  verify:
    name: Current-head manual runtime sign-off
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Require structured gameplay sign-off
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          IS_DRAFT: ${{ github.event.pull_request.draft }}
          PR_BODY: ${{ github.event.pull_request.body }}
        run: |
          changed="$(git diff --name-only "$BASE_SHA...$HEAD_SHA")"
          if ! printf '%s\n' "$changed" | grep -Eq \
            '^(crates/(hex_assets|hex_core|hex_lattice|hex_ai|hex_anim|hex_units|hex_combat|hex_game|hex_test_support)/|assets/config/(combat\.ron|elements\.ron|spells\.ron|lattices\.ron|combat_lab_maps\.ron|encounters/)|walks/)'
          then
            echo "No gameplay runtime path changed; manual gameplay sign-off is not required."
            exit 0
          fi

          if [ "$IS_DRAFT" = "true" ]
          then
            echo "Draft PR: sign-off becomes mandatory when the PR is marked ready."
            exit 0
          fi

          require_exact() {
            if ! printf '%s\n' "$PR_BODY" | grep -Fqx "$1"
            then
              echo "::error::Missing exact PR-body line: $1"
              exit 1
            fi
          }
          field_value() {
            printf '%s\n' "$PR_BODY" | sed -n "s/^$1: //p" | head -n 1
          }
          require_named_field() {
            value="$(field_value "$1")"
            case "$value" in
              ""|*"<"*|*"TODO"*|*"N/A"*|*"n/a"*)
                echo "::error::$1 must name the completed evidence, not a placeholder."
                exit 1
                ;;
            esac
          }

          require_exact "Manual runtime result: PASS"
          require_exact "Manual runtime commit: $HEAD_SHA"
          require_named_field "Manual runtime reviewer"
          require_named_field "Manual runtime route"

          date="$(field_value "Manual runtime date")"
          if ! printf '%s\n' "$date" | grep -Eq '^[0-9]{4}-[0-9]{2}-[0-9]{2}$'
          then
            echo "::error::Manual runtime date must use YYYY-MM-DD."
            exit 1
          fi
